name: Build Ola Browser v2.0

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Configure Version 2.0 & Custom S1 Icon & YouTube Blocker
      working-directory: OlaAirBrowser-Project
      run: |
        sed -i 's/compileSdk = 29/compileSdk = 34/g' app/build.gradle.kts
        sed -i 's/versionCode = 1/versionCode = 2/g' app/build.gradle.kts
        sed -i 's/versionName = "1.0.0"/versionName = "2.0"/g' app/build.gradle.kts
        sed -i 's/view\.title/view?.title/g' app/src/main/java/com/ola/browser/MainActivity.kt
        sed -i 's/view\.url/view?.url/g' app/src/main/java/com/ola/browser/MainActivity.kt
        
        # 1. Update AndroidManifest to use custom S1 Browser icon
        sed -i 's/@android:drawable\/sym_def_app_icon/@drawable\/ic_launcher/g' app/src/main/AndroidManifest.xml
        
        # 2. Create the custom Ola S1 Cockpit vector icon
        mkdir -p app/src/main/res/drawable
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path android:fillColor="#12151B" android:pathData="M54,4 C26.39,4 4,26.39 4,54 C4,81.61 26.39,104 54,104 C81.61,104 104,81.61 104,54 C104,26.39 81.61,4 54,4 Z" />
            <path android:strokeColor="#00E5FF" android:strokeWidth="3" android:fillColor="#00000000" android:pathData="M54,8 C28.6,8 8,28.6 8,54 C8,79.4 28.6,100 54,100 C79.4,100 100,79.4 100,54 C100,28.6 79.4,8 54,8 Z" />
            <path android:strokeColor="#1F3A44" android:strokeWidth="1.5" android:fillColor="#00000000" android:pathData="M18,54 L90,54" />
            <path android:strokeColor="#1F3A44" android:strokeWidth="1.5" android:fillColor="#00000000" android:pathData="M54,18 C40,32 40,76 54,90 C68,76 68,32 54,18 Z" />
            <path android:fillColor="#00E676" android:pathData="M58,26 L36,54 L52,54 L46,82 L72,50 L56,50 Z" />
            <path android:fillColor="#00E5FF" android:pathData="M55,32 L39,52 L50,52 L45,74 L65,49 L53,49 Z" />
            <path android:fillColor="#FFFFFF" android:pathData="M53,38 L43,51 L50,51 L46,65 L58,49 L51,49 Z" />
        </vector>
        EOF
        cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/drawable/ic_launcher_round.xml

        # 3. Inject High-Speed YouTube Ad Bypass Engine
        python3 -c "
        with open('app/src/main/java/com/ola/browser/MainActivity.kt', 'r') as f:
            c = f.read()

        yt_code = '''
                        // Special YouTube Ad Blocker (Instant Skip & Zero Ads)
                        view?.evaluateJavascript(\"\"\"
                            (function() {
                                var css = 'ins.adsbygoogle, .adsbygoogle, ytd-ad-slot-renderer, ytd-in-feed-ad-layout-renderer, ytd-banner-promo-renderer, .ytp-ad-module, .ytp-ad-overlay-container, .video-ads, #player-ads, .ad-container, ytm-promoted-sparkles-web-renderer, ytm-companion-ad-renderer { display: none !important; height: 0 !important; }';
                                var s = document.createElement('style'); s.textContent = css; (document.head || document.documentElement).appendChild(s);
                                if (location.hostname.indexOf('youtube.com') !== -1) {
                                    setInterval(function() {
                                        var v = document.querySelector('video');
                                        if (v && document.querySelector('.ad-showing, .ad-interrupting')) {
                                            v.muted = true;
                                            v.playbackRate = 16.0;
                                            if (isFinite(v.duration)) { v.currentTime = v.duration; }
                                        }
                                        var btn = document.querySelector('.ytp-ad-skip-button, .ytp-ad-skip-button-modern, .videoAdUiSkipButton');
                                        if (btn) btn.click();
                                        var cls = document.querySelector('.ytp-ad-overlay-close-button, #dismiss-button');
                                        if (cls) cls.click();
                                    }, 200);
                                }
                            })();
                        \"\"\".trimIndent(), null)
        '''
        if 'updateBookmarkStarState(url)' in c and 'Special YouTube Ad Blocker' not in c:
            c = c.replace('updateBookmarkStarState(url)', 'updateBookmarkStarState(url)' + yt_code, 1)

        with open('app/src/main/java/com/ola/browser/MainActivity.kt', 'w') as f:
            f.write(c)
        "

        gradle assembleDebug --stacktrace

    - name: Upload Version 2.0 APK
      uses: actions/upload-artifact@v4
      with:
        name: OlaAirBrowser-v2.0-APK
        path: OlaAirBrowser-Project/app/build/outputs/apk/**/*.apk
